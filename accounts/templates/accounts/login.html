{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 p-md-5">
            <h3 class="fw-bold mb-4 fs-4 text-center">Welcome Back</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary w-100 mt-3">Login</button>
            </form>
            <p class="text-center text-muted small mt-4 mb-0">
                Don't have an account? <a href="{% url 'register' %}" class="text-dark fw-semibold text-decoration-none">Register</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
