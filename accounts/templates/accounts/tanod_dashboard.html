{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card p-4 p-md-5">
            <span class="badge bg-dark text-white w-auto align-self-start mb-2 px-3 py-2 rounded-pill font-monospace small">Barangay Tanod Portal</span>
            <h2 class="fw-bold text-dark mb-2">Welcome, {{ user.get_full_name|default:user.username }}</h2>
            <p class="text-muted mb-4">Manage active neighborhood response alerts and dispatch logs here.</p>

            <div class="d-flex flex-wrap gap-2">
                <a href="{% url 'manage_complaints' %}" class="btn btn-dark">Review Noise Complaints</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
