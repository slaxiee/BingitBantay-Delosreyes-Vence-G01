<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BingitBantay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .navbar { background-color: #ffffff !important; border-bottom: 1px solid #e2e8f0; }
        .navbar-brand { font-weight: 600; letter-spacing: -0.5px; color: #0f172a !important; }
        .nav-link { font-size: 0.925rem; font-weight: 500; color: #475569 !important; transition: color 0.2s ease; }
        .nav-link:hover { color: #0f172a !important; }
        .card { border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); background-color: #ffffff; }
        .btn-primary { background-color: #0f172a; border-color: #0f172a; border-radius: 8px; font-weight: 500; padding: 0.6rem 1rem; }
        .btn-primary:hover { background-color: #1e293b; border-color: #1e293b; }
        .form-control, .form-select { border-radius: 8px; border: 1px solid #cbd5e1; padding: 0.6rem 0.75rem; }
        .form-control:focus { border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top py-3 mb-5">
        <div class="container">
            <a class="navbar-brand fs-5" href="{% url 'dashboard_redirect' %}">🛡️ BingitBantay</a>
            <div class="navbar-nav ms-auto align-items-lg-center gap-2">
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'dashboard_redirect' %}">Dashboard</a>
                    <a class="nav-link" href="{% url 'profile' %}">Profile</a>
                    <a class="nav-link text-danger fw-medium ms-lg-2" href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Login</a>
                    <a class="btn btn-primary btn-sm text-white px-3 ms-lg-2" href="{% url 'register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container mb-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} border-0 shadow-sm alert-dismissible fade show rounded-3 mb-4" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
